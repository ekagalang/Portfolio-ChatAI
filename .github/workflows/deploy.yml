name: Deploy

# Deploy setelah workflow "CI" sukses di branch main. Berjalan di self-hosted
# runner VPS yang punya akses Docker + direktori deploy /home/a/dck/main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, portfolio]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Sinkronkan source ke direktori deploy (context build compose).
      # .env.production TIDAK ikut (secret dijaga di VPS).
      - name: Sync ke /home/a/dck/main
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env.production' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            "$GITHUB_WORKSPACE/" /home/a/dck/main/

      # Portfolio = service `app_main` di project `dck` (monolith /home/a/dck
      # meng-include main/compose.yml). Build image (container lama tetap
      # melayani), jalankan migrasi via stage `migrator` (deps penuh), lalu
      # recreate HANYA app_main.
      - name: Build image
        working-directory: /home/a/dck
        run: |
          # NEXT_PUBLIC_* di-inline saat build → export dari .env.production
          for k in NEXT_PUBLIC_MIDTRANS_CLIENT_KEY NEXT_PUBLIC_APP_URL NEXT_PUBLIC_UMAMI_ID NEXT_PUBLIC_UMAMI_URL; do
            v=$(grep -E "^${k}=" main/.env.production | head -1 | cut -d= -f2- || true)
            export "${k}=${v}"
          done
          docker compose build app_main

      - name: Migrate Postgres (stage migrator, jaringan dck_backend)
        run: |
          docker build --target migrator -t pf_migrate /home/a/dck/main
          docker run --rm --network dck_backend --env-file /home/a/dck/main/.env.production \
            pf_migrate npx prisma migrate deploy

      - name: Recreate app_main
        working-directory: /home/a/dck
        run: docker compose up -d app_main

      - name: Tunggu container healthy
        run: |
          for i in $(seq 1 24); do
            s=$(docker inspect -f '{{.State.Health.Status}}' main_apps 2>/dev/null || echo none)
            echo "health($i): $s"
            [ "$s" = "healthy" ] && exit 0
            sleep 5
          done
          echo "::error::main_apps tidak healthy setelah deploy"
          docker logs --tail=100 main_apps || true
          exit 1

      # Reload nginx agar re-resolve IP container baru (proxy_pass statis).
      - name: Reload nginx
        run: docker exec nginx_utama nginx -s reload
