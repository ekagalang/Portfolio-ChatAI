name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Dummy values — cukup agar `prisma generate` & `next build` jalan di CI.
      # Bukan secret asli; jangan dipakai di produksi.
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-dummy-secret-not-for-production-32chars"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prisma Client harus di-generate sebelum typecheck/build.
      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
