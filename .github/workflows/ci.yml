name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    # Self-hosted runner di VPS (label: portfolio). Lihat docs/CICD.md.
    runs-on: [self-hosted, portfolio]
    env:
      # URL Postgres dummy — cukup untuk `prisma generate` & `next build`
      # (route semuanya dynamic → tidak ada koneksi DB saat build).
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      AUTH_SECRET: "ci-dummy-secret-not-for-production-32chars"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
