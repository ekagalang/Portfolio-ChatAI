services:
  app_main:
    build:
      context: ${DCK_ROOT:-/home/a/dck}/main
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_UMAMI_ID: ${NEXT_PUBLIC_UMAMI_ID:-}
        NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
        NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    container_name: main_apps
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # DATABASE_URL (Postgres) + secret lain diambil dari .env.production.
      # Untuk Postgres/Redis di jaringan Docker, lihat docs/SCALING.md.
    # Jaringan `frontend` (dck_frontend, nginx) & `backend` (dck_backend,
    # postgres/redis) didefinisikan oleh compose/infra.yml. File ini di-include
    # oleh /home/a/dck/docker-compose.yml (project `dck`) → jangan deklarasi ulang.
    networks:
      - frontend
      - backend
    healthcheck:
      # 127.0.0.1 (bukan localhost) — localhost resolve ke IPv6 ::1 di container,
      # sedangkan server listen di IPv4 0.0.0.0 → wget refused → unhealthy palsu.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"